<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Circle Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- トップバー -->
    <header class="topbar">
        <button class="menu-toggle" id="menu-toggle">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <a href="index.html" class="logo">InstaCircle</a>
    </header>

    <!-- サイドバーオーバーレイ -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- サイドバー -->
    <aside class="sidebar" id="sidebar">
        <nav class="menu">
            <button class="accordion-btn">
                <span>メインメニュー</span>
                <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="accordion-content">
                <a href="news.html" class="menu-item" data-page="news">お知らせ</a>
                <a href="knowledge.html" class="menu-item" data-page="knowledge">ノウハウ一覧</a>
                <a href="members.html" class="menu-item" data-page="members">メンバー一覧</a>
                <a href="prompts.html" class="menu-item" data-page="prompts">プロンプト集</a>
            </div>
            
            <button class="accordion-btn">
                <span>その他</span>
                <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="accordion-content">
                <a href="resources.html" class="menu-item" data-page="resources">リソース</a>
                <a href="schedule.html" class="menu-item" data-page="schedule">スケジュール</a>
                <a href="links.html" class="menu-item" data-page="links">関連リンク</a>
            </div>
        </nav>
    </aside>

    <!-- メインコンテンツ -->
    <main class="main-content" id="app">
<div class="page-container gs-reveal">
    <h1>お知らせ</h1>
    
    <ul class="news-list">
        <li class="news-item gs-item">
            <a href="#">
                <div class="news-meta">
                    <time datetime="2026-08-20">2026.08.20</time>
                    <span class="badge badge-update">UPDATE</span>
                </div>
                <h3 class="news-title"></h3>
            </a>
        </li>
        <li class="news-item gs-item">
            <a href="#">
                <div class="news-meta">
                    <time datetime="2026-08-15">2026.09.12</time>
                    <span class="badge badge-event">EVENT</span>
                </div>
                <h3 class="news-title">名古屋オフ会</h3>
            </a>
        </li>
        <li class="news-item gs-item">
            <a href="#">
                <div class="news-meta">
                    <time datetime="2026-08-01">2026.08.20</time>
                    <span class="badge badge-info">INFO</span>
                </div>
                <h3 class="news-title">サークルメンバー専用のポータルサイトを開設しました！</h3>
            </a>
        </li>
    </ul>
</div>

</main>

    <!-- GSAP & ScrollTrigger Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Custom JS -->
    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>

    

</body>
</html>
