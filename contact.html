<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- cSpell:ignore InstaCircle -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="インスタ部への連絡ページ。">
    <title>のぞいてみる｜Instagram Circle Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css?v=1787214249096">
</head>
<body>

    <!-- トップバー -->
    <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="メニューを開く">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <a href="index.html" class="logo">InstaCircle</a>
    </header>

    <!-- サイドバーオーバーレイ -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- サイドバー -->
    <aside class="sidebar" id="sidebar">
        <nav class="menu" aria-label="サイトメニュー">
            <button class="accordion-btn">
                <span>メインメニュー</span>
                <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="accordion-content">
                <a href="news.html" class="menu-item" data-page="news">お知らせ</a>
                <a href="knowledge.html" class="menu-item" data-page="knowledge">ノウハウ一覧</a>
                <a href="members.html" class="menu-item" data-page="members">メンバー一覧</a>
                <a href="prompts.html" class="menu-item" data-page="prompts">プロンプト集</a>
            </div>

            <button class="accordion-btn">
                <span>その他</span>
                <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="accordion-content">
                <a href="resources.html" class="menu-item" data-page="resources">リソース</a>
                <a href="schedule.html" class="menu-item" data-page="schedule">スケジュール</a>
                <a href="links.html" class="menu-item" data-page="links">関連リンク</a>
            </div>
        </nav>
    </aside>

    <!-- メインコンテンツ -->
    <main class="main-content" id="app" aria-label="お問い合わせ">
        <div class="article-container gs-reveal">
            <header class="article-header">
                <h1>のぞいてみる</h1>
                <div class="article-meta">さいごまで見てくれて、ありがとう。</div>
            </header>

            <div class="article-content gs-item">
                <section class="contact-section">
                    <div class="contact-cloud one" aria-hidden="true">☁</div>
                    <div class="contact-cloud two" aria-hidden="true">☁</div>
                    <div class="contact-inner reveal">
                        <h2>ちょっと気になるな、<br>くらいで大丈夫です。</h2>
                        <span>いっしょに楽しいこと、考えませんか？</span>
                        <button type="button" id="contactButton">気軽に声をかける <i aria-hidden="true">☺</i></button>
                    </div>
                </section>
                <div id="toast" role="status" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <!-- Animation & ScrollTrigger Libraries -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Custom JS -->
    <script defer src="js/theme.js"></script>
    <script defer src="js/main.js"></script>

</body>
</html>
